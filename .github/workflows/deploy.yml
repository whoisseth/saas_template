name: deploy
on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment to deploy'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
          - both

permissions:
  contents: read

jobs:
  # Deploys only when the Cloudflare credentials exist, so forks, Dependabot PRs and
  # fresh copies of the template skip cleanly instead of failing.
  config:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=deploy skipped::Set repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable deploys."
          fi

  deploy-preview:
    needs: config
    if: |
      needs.config.outputs.enabled == 'true' && (
        github.ref == 'refs/heads/preview' ||
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'preview' || github.event.inputs.target == 'both'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, deployments: write }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Sanitize Cloudflare credentials
        run: |
          ACCOUNT_ID=$(printf '%s' "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" | sed -e 's/^[sS]ecret:[[:space:]]*//' -e 's/^[sS]ecret[[:space:]]*//' | tr -d '[:space:]')
          API_TOKEN=$(printf '%s' "${{ secrets.CLOUDFLARE_API_TOKEN }}" | sed -e 's/^[sS]ecret:[[:space:]]*//' -e 's/^[sS]ecret[[:space:]]*//' | tr -d '[:space:]')
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$API_TOKEN" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Export preview variables for the build
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          APP_URL=$(printf '%s' "$VARS_JSON" | jq -r '.NEXT_PUBLIC_APP_URL // ""')
          if [ -z "$APP_URL" ] || [ "$APP_URL" = "null" ]; then
            APP_URL="https://saas-template-preview.whoisseth.workers.dev"
          fi
          echo "NEXT_PUBLIC_APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_IS_PREVIEW=true" >> "$GITHUB_ENV"
      - run: pnpm build:worker
      - name: Deploy to preview
        run: |
          pnpm db:migrate:preview || true
          pnpm wrangler deploy --env preview

  deploy-production:
    needs: config
    if: |
      needs.config.outputs.enabled == 'true' && (
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'production' || github.event.inputs.target == 'both'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, deployments: write }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Sanitize Cloudflare credentials
        run: |
          ACCOUNT_ID=$(printf '%s' "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" | sed -e 's/^[sS]ecret:[[:space:]]*//' -e 's/^[sS]ecret[[:space:]]*//' | tr -d '[:space:]')
          API_TOKEN=$(printf '%s' "${{ secrets.CLOUDFLARE_API_TOKEN }}" | sed -e 's/^[sS]ecret:[[:space:]]*//' -e 's/^[sS]ecret[[:space:]]*//' | tr -d '[:space:]')
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$API_TOKEN" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Export production variables for the build
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          APP_URL=$(printf '%s' "$VARS_JSON" | jq -r '.NEXT_PUBLIC_APP_URL // ""')
          if [ -z "$APP_URL" ] || [ "$APP_URL" = "null" ]; then
            APP_URL="https://saas-template-prod.whoisseth.workers.dev"
          fi
          echo "NEXT_PUBLIC_APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_IS_PREVIEW=false" >> "$GITHUB_ENV"
      - run: pnpm build:worker
      - name: Deploy to production
        run: |
          pnpm db:migrate:prod || true
          pnpm wrangler deploy --env production
