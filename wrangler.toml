name = "saas-template"
main = ".open-next/worker.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

assets = { directory = ".open-next/assets", binding = "ASSETS" }

# ===== Default env used for local dev; override per-env below =====
[vars]
NEXT_PUBLIC_APP_URL = "http://localhost:3000"
NEXT_PUBLIC_APP_NAME = "SaaS Template"
NEXT_PUBLIC_IS_PREVIEW = "false"
BETTER_AUTH_RP_ID = "localhost"
NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME = "dzqnzl3ir"
NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET = "mht0pfa5"

[[d1_databases]]
binding = "DB"
database_name = "saas_db"
database_id = "64fa4384-d1e9-4106-a6ad-b7231068d7be"
migrations_dir = "db/migrations"

[[kv_namespaces]]
binding = "NEXT_INC_CACHE_KV"
id = "75c9dc013e584c1c8d774fd3a26c1232"

[[kv_namespaces]]
binding = "CACHE"
id = "0c362b44c7c94e8faf7c676918bb8c2a"

[[queues.producers]]
binding = "JOBS"
queue = "saas-jobs"

# [[queues.consumers]]
# queue = "saas-jobs"
# max_batch_size = 10
# max_batch_timeout = 5
# dead_letter_queue = "saas-jobs-dlq"

[observability]
enabled = true

# ===== Preview =====
[env.preview]
name = "saas-template-preview"
workers_dev = true

[env.preview.vars]
NEXT_PUBLIC_APP_NAME = "SaaS Template (Preview)"
NEXT_PUBLIC_APP_URL = "https://saas-template-preview.whoisseth.workers.dev"
NEXT_PUBLIC_IS_PREVIEW = "true"
BETTER_AUTH_RP_ID = "whoisseth.workers.dev"
NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME = "dzqnzl3ir"
NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET = "mht0pfa5"
GOOGLE_CLIENT_ID = "212342242306-71l03g04pq683jjgqpjv0jr7ieulvfeg.apps.googleusercontent.com"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "saas_db_preview"
database_id = "1405c8f5-5ee5-43ee-959f-7ba31ec4d8ad"
migrations_dir = "db/migrations"

[[env.preview.kv_namespaces]]
binding = "NEXT_INC_CACHE_KV"
id = "b64ce12660154fc1a475fa7a3aa4d09d"

[[env.preview.kv_namespaces]]
binding = "CACHE"
id = "3c13c280c79c44ccbc12d128d7170881"

[[env.preview.queues.producers]]
binding = "JOBS"
queue = "saas-jobs-preview"

# ===== Production =====
[env.production]
name = "saas-template-prod"
workers_dev = true

[env.production.vars]
NEXT_PUBLIC_APP_NAME = "SaaS Template"
NEXT_PUBLIC_APP_URL = "https://saas-template-prod.whoisseth.workers.dev"
NEXT_PUBLIC_IS_PREVIEW = "false"
BETTER_AUTH_RP_ID = "whoisseth.workers.dev"
NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME = "dzqnzl3ir"
NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET = "mht0pfa5"
GOOGLE_CLIENT_ID = "212342242306-71l03g04pq683jjgqpjv0jr7ieulvfeg.apps.googleusercontent.com"

[[env.production.d1_databases]]
binding = "DB"
database_name = "saas_db"
database_id = "64fa4384-d1e9-4106-a6ad-b7231068d7be"
migrations_dir = "db/migrations"

[[env.production.kv_namespaces]]
binding = "NEXT_INC_CACHE_KV"
id = "75c9dc013e584c1c8d774fd3a26c1232"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "0c362b44c7c94e8faf7c676918bb8c2a"

[[env.production.queues.producers]]
binding = "JOBS"
queue = "saas-jobs"

